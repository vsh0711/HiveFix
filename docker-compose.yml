services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  orchestrator:
    build: ./orchestrator
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - redis
      - qdrant
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_ORCHESTRATOR_URL: http://localhost:8000
    depends_on:
      - orchestrator
    ports:
      - "3000:3000"

volumes:
  qdrant_data:
