services:
  - type: web
    name: hivefix-orchestrator
    runtime: docker
    dockerfilePath: ./orchestrator/Dockerfile
    dockerContext: ./orchestrator
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: hivefix
      - key: GITHUB_TOKEN
        sync: false
      - key: HIVEFIX_REPO
        sync: false
      - key: HIVEFIX_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: hivefix_code_chunks
      - key: MAX_PATCH_ATTEMPTS
        value: "3"
      - key: SANDBOX_POLL_INTERVAL_SECONDS
        value: "10"
      - key: SANDBOX_POLL_TIMEOUT_SECONDS
        value: "900"

  - type: web
    name: hivefix-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile.prod
    dockerContext: ./frontend
    plan: free
    envVars:
      # Next.js inlines NEXT_PUBLIC_* into the client bundle at build time, so this
      # must be set before the Docker build runs, not just at container start —
      # Render passes service env vars through as Docker build args for
      # runtime:docker services, which Dockerfile.prod's ARG picks up.
      - key: NEXT_PUBLIC_ORCHESTRATOR_URL
        value: https://hivefix-orchestrator.onrender.com
