name: sandbox-test

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Target repo to clone (https URL)"
        required: true
      base_ref:
        description: "Branch/ref to check out before applying the patch"
        required: true
      patch_b64:
        description: "Base64-encoded unified diff to apply"
        required: true
      test_command:
        description: "Command to run inside the sandbox container"
        required: true
        default: "pytest -q"
      run_token:
        description: "Unique token the orchestrator uses to find this run"
        required: true

run-name: sandbox-test ${{ inputs.run_token }}

jobs:
  run-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Clone target repo
        run: git clone --depth 1 --branch "${{ inputs.base_ref }}" "${{ inputs.repo_url }}" target

      - name: Apply candidate patch
        run: |
          echo "${{ inputs.patch_b64 }}" | base64 --decode > patch.diff
          cd target
          git apply --whitespace=fix ../patch.diff

      - name: Run tests in Docker sandbox
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/target:/workspace" \
            -w /workspace \
            python:3.11-slim \
            bash -c "pip install -q -e . >/dev/null 2>&1 || pip install -q -r requirements.txt >/dev/null 2>&1 || true; ${{ inputs.test_command }}"
